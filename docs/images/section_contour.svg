<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#222">图 2　截线：几何着色器逐三角形与平面求交</text>

  <!-- plane -->
  <rect x="80" y="300" width="800" height="22" rx="4" fill="rgba(70,130,255,0.18)" stroke="#3b6fd4" stroke-width="2"/>
  <text x="890" y="316" text-anchor="end" font-size="15" fill="#3b6fd4">剖切平面（无限延伸）</text>

  <!-- triangle -->
  <polygon points="260,150 620,470 700,420" fill="rgba(255,150,0,0.18)" stroke="#d9820b" stroke-width="2"/>
  <text x="250" y="140" font-size="15" fill="#a86606" font-weight="bold">V0（保留侧 f≤0）</text>
  <text x="700" y="480" font-size="15" fill="#a86606" font-weight="bold">V1（移除侧 f&gt;0）</text>
  <text x="740" y="420" font-size="15" fill="#a86606" font-weight="bold">V2</text>

  <!-- intersection segment -->
  <line x1="440" y1="310" x2="521" y2="310" stroke="#e0342c" stroke-width="6" stroke-linecap="round"/>
  <text x="480" y="296" text-anchor="middle" font-size="16" fill="#e0342c" font-weight="bold">截线（发射线段）</text>

  <!-- crossing points -->
  <circle cx="440" cy="310" r="6" fill="#e0342c"/>
  <text x="424" y="292" font-size="15" fill="#e0342c" font-weight="bold">P</text>
  <circle cx="521" cy="310" r="6" fill="#e0342c"/>
  <text x="538" y="292" font-size="15" fill="#e0342c" font-weight="bold">Q</text>

  <text x="120" y="350" font-size="14" fill="#666">保留侧 f ≤ 0（可见）</text>
  <text x="120" y="410" font-size="14" fill="#666">移除侧 f &gt; 0（被剪掉）</text>

  <!-- formula -->
  <rect x="80" y="440" width="800" height="96" rx="8" fill="#f6f8fb" stroke="#d5dde8"/>
  <text x="100" y="468" font-size="15" font-weight="bold" fill="#274a75">几何着色器逻辑（伪代码）</text>
  <g font-size="14" fill="#333" font-family="Consolas,Menlo,monospace">
    <text x="100" y="494">d[i] = dot(plane.xyz, V[i]) + plane.w</text>
    <text x="100" y="514">对每条边 (i, j)：若 sign(d[i]) ≠ sign(d[j]) →  t = d[i] / (d[i] − d[j]);  P = mix(V[i], V[j], t)</text>
    <text x="100" y="534">两个交点组成 line_strip 发射（max_vertices = 2），深度加 bias 偏向相机</text>
  </g>
</svg>
