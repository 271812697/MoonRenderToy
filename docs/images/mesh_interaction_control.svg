<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b3a55">交互控制：勾选 → 可见性 → 重建索引 → 渲染</text>

  <!-- TreeView -->
  <rect x="40" y="80" width="200" height="150" rx="8" fill="#fdf3e3" stroke="#d19a3e"/>
  <text x="140" y="108" text-anchor="middle" font-weight="bold" fill="#7a5714">TreeView 勾选</text>
  <text x="60" y="140" fill="#7a5714">取消勾选 Edge_3 /</text>
  <text x="60" y="160" fill="#7a5714">Edges 组 / Shell / Solid</text>
  <text x="60" y="190" fill="#a08040">onCheckStageChange</text>

  <!-- Actor -->
  <rect x="330" y="80" width="240" height="150" rx="8" fill="#e8f0fb" stroke="#4a6fa5"/>
  <text x="450" y="108" text-anchor="middle" font-weight="bold" fill="#2b3a55">Actor::SetActive(递归)</text>
  <text x="350" y="140" fill="#33475f">子树叶子 IsActive() 变 false</text>
  <text x="350" y="165" fill="#66788f">IsActive = m_active</text>
  <text x="350" y="185" fill="#66788f">          &amp;&amp; parent-&gt;IsActive()</text>
  <text x="350" y="215" fill="#33475f">祖先感知：勾组=批量隐藏</text>

  <!-- CTopoShape -->
  <rect x="660" y="80" width="260" height="150" rx="8" fill="#eaf6ec" stroke="#4f9d69"/>
  <text x="790" y="108" text-anchor="middle" font-weight="bold" fill="#2b5a3c">CTopoShape</text>
  <text x="680" y="140" fill="#335f44">updateChildBuffer()</text>
  <text x="680" y="164" fill="#335f44">→ updateChildMesh()：面两区间</text>
  <text x="680" y="186" fill="#335f44">→ updateEdgeMesh()：边区间</text>
  <text x="680" y="216" fill="#5d7d69">按 faceActors/edgeLeafActors 的</text>
  <text x="680" y="234" fill="#5d7d69">IsActive() 重建可见索引</text>

  <line x1="240" y1="155" x2="330" y2="155" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="155" x2="660" y2="155" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Mesh -->
  <rect x="330" y="300" width="240" height="130" rx="8" fill="#eaf6ec" stroke="#4f9d69"/>
  <text x="450" y="328" text-anchor="middle" font-weight="bold" fill="#2b5a3c">Mesh::UploadIndices</text>
  <text x="350" y="358" fill="#335f44">面：UploadIndices(childList, 0/1)</text>
  <text x="350" y="382" fill="#335f44">边：UploadIndices(visibleIdx, 0)</text>
  <text x="350" y="410" fill="#5d7d69">只重传索引，顶点不动</text>

  <!-- Renderer -->
  <rect x="660" y="300" width="260" height="130" rx="8" fill="#f8fafd" stroke="#b9cbe8"/>
  <text x="790" y="328" text-anchor="middle" font-weight="bold" fill="#2b3a55">渲染端</text>
  <text x="680" y="358" fill="#33475f">GetIndexCount(range)==0 → 跳过</text>
  <text x="680" y="382" fill="#33475f">可见子集 → 只画可见部分</text>
  <text x="680" y="410" fill="#66788f">拾取同步（不画=不可点）</text>

  <line x1="450" y1="230" x2="450" y2="300" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="365" x2="660" y2="365" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 触发入口 -->
  <rect x="40" y="470" width="880" height="70" rx="8" fill="#eef1f6" stroke="#8a99ad"/>
  <text x="60" y="498" font-weight="bold" fill="#2b3a55">其它触发入口：</text>
  <text x="60" y="524" fill="#33475f">hover/选中高亮（SelectionManager → hoverChild/selectChildFaces → 透明区间或 domainColorTex 颜色）</text>
</svg>
