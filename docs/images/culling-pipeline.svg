<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#455A64"/></marker></defs><rect width="1280" height="700" fill="white"/><text x="640" y="30" font-size="19" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle" font-weight="bold">全在视锥内时的剔除流水线（示意数量）</text><rect x="370.0" y="90" width="540" height="70" rx="8" fill="#F5F5F5" stroke="#616161" stroke-width="1.6"/><text x="640.0" y="124" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="640.0" y="124" font-size="15" font-weight="normal">场景全部实体    20000</tspan></text><text x="640" y="182" font-size="12" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">视锥剔除在这里基本无效</text><line x1="640" y1="160" x2="640" y2="198" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="400.0" y="212" width="480" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/><text x="640.0" y="246" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="640.0" y="246" font-size="15" font-weight="normal">屏幕尺寸剔除    ~12000</tspan></text><text x="640" y="304" font-size="12" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">投影半径 &lt; 阈值像素 → 丢弃</text><line x1="640" y1="282" x2="640" y2="320" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="430.0" y="334" width="420" height="70" rx="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.6"/><text x="640.0" y="368" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="640.0" y="368" font-size="15" font-weight="normal">HZB 遮挡剔除    ~5000</tspan></text><text x="640" y="426" font-size="12" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">被外壳/其它零件挡住的 → 丢弃</text><line x1="640" y1="404" x2="640" y2="442" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="460.0" y="456" width="360" height="70" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.6"/><text x="640.0" y="490" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="640.0" y="490" font-size="15" font-weight="normal">LOD + 重要度预算    ~3500</tspan></text><text x="640" y="548" font-size="12" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">降精度 / 超预算的降级或丢弃</text><line x1="640" y1="526" x2="640" y2="564" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="490.0" y="578" width="300" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><text x="640.0" y="612" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="640.0" y="612" font-size="15" font-weight="normal">实际提交绘制    ~3500</tspan></text><text x="640" y="670" font-size="12" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">合并/实例化后再变成几十~几百个 draw</text><text x="640" y="704" font-size="12" fill="#9E9E9E" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle" font-style="italic">数量为示意：真实比例取决于场景遮挡程度与屏幕占比</text></svg>