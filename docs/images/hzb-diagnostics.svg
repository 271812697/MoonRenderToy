<text x="1201" y="444" font-size="12" fill="#B71C1C" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">hzbBias，静止</text>
<text x="1201" y="462" font-size="12" fill="#B71C1C" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">帧会自动收紧</text>
<line x1="880" y1="470" x2="1050" y2="560" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1056" y="540" width="210" height="80" rx="8" fill="#FFE0B2" stroke="#E65100" stroke-width="1.8"/>
<text x="1161" y="566" font-size="12" fill="#BF360C" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">bg：tile 混进背景</text>
<text x="1161" y="584" font-size="12" fill="#BF360C" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">提高网格分辨率</text>
<text x="1161" y="602" font-size="12" fill="#BF360C" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">或收紧 AABB</text>
<text x="640" y="620" font-size="13" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">日志行示例：[HZB] bvh 4 visited 3 culled 1 occludedInst 0 skipped 0 tests[occluded 1 biasRejected 0 bgRejected 2] …</text>
<text x="640" y="650" font-size="12" fill="#9E9E9E" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle" font-style="italic">建议：先看 bvh 和 depth，再看 culled/occludedInst，最后看 tests 的拒绝原因</text>
