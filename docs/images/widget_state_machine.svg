<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
  </defs>
  <text x="460" y="36" text-anchor="middle" font-size="22" fill="#222">图 2　ClipPlane 交互状态机</text>

  <!-- Stop -->
  <rect x="60" y="210" width="190" height="80" rx="10" fill="#f7f7f7" stroke="#999"/>
  <text x="155" y="244" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Stop</text>
  <text x="155" y="268" text-anchor="middle" font-size="13" fill="#666">初始：无命中</text>

  <!-- Hot -->
  <rect x="365" y="210" width="190" height="80" rx="10" fill="#eaf4ea" stroke="#6fa86f"/>
  <text x="460" y="244" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6b2e">Hot</text>
  <text x="460" y="268" text-anchor="middle" font-size="13" fill="#666">悬停命中手柄，高亮</text>

  <!-- AxisT -->
  <rect x="700" y="70" width="180" height="70" rx="10" fill="#ffffff" stroke="#7f9bc9"/>
  <text x="790" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#274a75">AxisT</text>
  <text x="790" y="122" text-anchor="middle" font-size="13" fill="#666">沿轴拖拽</text>

  <!-- PlaneT -->
  <rect x="700" y="235" width="180" height="70" rx="10" fill="#ffffff" stroke="#7f9bc9"/>
  <text x="790" y="265" text-anchor="middle" font-size="16" font-weight="bold" fill="#274a75">PlaneT</text>
  <text x="790" y="287" text-anchor="middle" font-size="13" fill="#666">在平面内拖拽</text>

  <!-- AxisR -->
  <rect x="700" y="400" width="180" height="70" rx="10" fill="#ffffff" stroke="#7f9bc9"/>
  <text x="790" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#274a75">AxisR</text>
  <text x="790" y="452" text-anchor="middle" font-size="13" fill="#666">绕轴旋转</text>

  <!-- transitions -->
  <g stroke="#666" stroke-width="2" font-size="13" fill="#444">
    <path d="M 250 245 C 300 245, 310 245, 363 245" fill="none" marker-end="url(#a)"/>
    <text x="306" y="236" text-anchor="middle">onMouseMove 命中</text>

    <path d="M 365 270 C 315 300, 300 310, 255 285" fill="none" marker-end="url(#a)"/>
    <text x="285" y="315" text-anchor="middle">移出（未命中）</text>

    <path d="M 555 220 C 620 150, 660 110, 698 95" fill="none" marker-end="url(#a)"/>
    <text x="640" y="150" text-anchor="middle">按下：箭头块</text>

    <path d="M 555 250 C 640 265, 660 265, 698 262" fill="none" marker-end="url(#a)"/>
    <text x="628" y="292" text-anchor="middle">按下：平面块</text>

    <path d="M 555 290 C 630 370, 680 420, 698 425" fill="none" marker-end="url(#a)"/>
    <text x="640" y="385" text-anchor="middle">按下：圆柱块（旋转环）</text>

    <path d="M 700 120 C 620 180, 560 210, 540 235" fill="none" marker-end="url(#a)"/>
    <text x="600" y="175" text-anchor="middle">松开</text>

    <path d="M 700 280 C 620 285, 570 285, 557 285" fill="none" marker-end="url(#a)"/>
    <text x="640" y="276" text-anchor="middle">松开</text>

    <path d="M 700 440 C 620 380, 560 310, 545 292" fill="none" marker-end="url(#a)"/>
    <text x="610" y="395" text-anchor="middle">松开</text>
  </g>

  <text x="460" y="500" text-anchor="middle" font-size="14" fill="#666">松开（AxisT/PlaneT/AxisR → Hot）时恢复高亮，并调用 updateSection() 刷新截面</text>
  <text x="460" y="524" text-anchor="middle" font-size="14" fill="#666">拖拽过程中 onMouseMove 持续调用 gizmo 行为，并置 updateEngineUbo = true</text>
</svg>
