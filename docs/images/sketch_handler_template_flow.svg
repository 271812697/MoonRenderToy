<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
  </defs>
  <text x="460" y="34" text-anchor="middle" font-size="22" fill="#222">图 5　模板方法：一次左键点击的框架调用链</text>

  <line x1="140" y1="70" x2="140" y2="520" stroke="#ccc"/>
  <line x1="340" y1="70" x2="340" y2="520" stroke="#ccc"/>
  <line x1="580" y1="70" x2="580" y2="520" stroke="#ccc"/>
  <line x1="790" y1="70" x2="790" y2="520" stroke="#ccc"/>
  <text x="140" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">鼠标 / Interactor</text>
  <text x="340" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">EventWidget（框架）</text>
  <text x="580" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">DefaultHandler（框架）</text>
  <text x="790" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Arc / SketcherObj</text>

  <rect x="90" y="84" width="100" height="34" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="140" y="106" text-anchor="middle" font-size="12" fill="#333">左键按下</text>
  <line x1="190" y1="101" x2="300" y2="101" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <rect x="310" y="84" width="60" height="34" rx="6" fill="#eef3fa" stroke="#7a95b8"/>
  <text x="340" y="106" text-anchor="middle" font-size="12" fill="#2b4a6f">onLeftMousePressed</text>

  <line x1="370" y1="118" x2="370" y2="140" stroke="#666" stroke-width="2"/>
  <rect x="310" y="140" width="60" height="34" rx="6" fill="#eef3fa" stroke="#7a95b8"/>
  <text x="340" y="162" text-anchor="middle" font-size="12" fill="#2b4a6f">ButtonPressParse</text>
  <line x1="370" y1="174" x2="540" y2="196" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <rect x="540" y="180" width="80" height="34" rx="6" fill="#f4f8f4" stroke="#6fa86f"/>
  <text x="580" y="202" text-anchor="middle" font-size="12" fill="#2e6b2e">onButtonPressed</text>
  <line x1="620" y1="214" x2="760" y2="238" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <rect x="740" y="222" width="100" height="34" rx="6" fill="#fdeeee" stroke="#c96a6a"/>
  <text x="790" y="244" text-anchor="middle" font-size="12" fill="#8b2f2f">updateDataAndDrawToPosition(pos)</text>
  <line x1="790" y1="256" x2="790" y2="290" stroke="#666" stroke-width="2"/>
  <line x1="790" y1="290" x2="660" y2="308" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <rect x="600" y="292" width="120" height="34" rx="6" fill="#f4f8f4" stroke="#6fa86f"/>
  <text x="660" y="314" text-anchor="middle" font-size="12" fill="#2e6b2e">canGoToNextMode()?</text>
  <line x1="660" y1="326" x2="660" y2="358" stroke="#666" stroke-width="2"/>
  <line x1="660" y1="358" x2="570" y2="376" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <rect x="500" y="360" width="140" height="34" rx="6" fill="#f4f8f4" stroke="#6fa86f"/>
  <text x="570" y="382" text-anchor="middle" font-size="12" fill="#2e6b2e">moveToNextMode()</text>
  <line x1="570" y1="394" x2="340" y2="414" stroke="#666" stroke-width="2" marker-end="url(#a)"/>

  <rect x="160" y="398" width="250" height="46" rx="6" fill="#faf6ee" stroke="#c9a35f"/>
  <text x="285" y="420" text-anchor="middle" font-size="12" fill="#7a5a1e">每帧 update() → onUpdate() 绘制预览</text>
  <text x="285" y="438" text-anchor="middle" font-size="11" fill="#888">CreateAndDrawShapeGeometry → drawEdit → lines</text>

  <rect x="310" y="470" width="60" height="34" rx="6" fill="#eef3fa" stroke="#7a95b8"/>
  <text x="340" y="492" text-anchor="middle" font-size="12" fill="#2b4a6f">releaseButton → finish</text>
  <line x1="370" y1="470" x2="540" y2="470" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <rect x="540" y="452" width="80" height="36" rx="6" fill="#f4f8f4" stroke="#6fa86f"/>
  <text x="580" y="474" text-anchor="middle" font-size="12" fill="#2e6b2e">executeCommands</text>
  <line x1="620" y1="470" x2="760" y2="470" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <rect x="760" y="452" width="60" height="36" rx="6" fill="#eef7ee" stroke="#4f8f4f"/>
  <text x="790" y="474" text-anchor="middle" font-size="12" fill="#1f5c1f">addGeometry</text>

  <text x="460" y="540" text-anchor="middle" font-size="12" fill="#888">蓝色/绿色 = 框架固定逻辑；红色 = 子类覆写的钩子（Arc 只实现 updateData…/createShape/canGoToNextMode）</text>
</svg>
