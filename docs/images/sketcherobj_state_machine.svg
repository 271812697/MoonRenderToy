<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="460" y="34" text-anchor="middle" font-size="21" fill="#222">图 2　SketcherObj 选择/编辑状态机（onMouseMove / onLeftMousePressed / onLeftMouseReleased）</text>

  <!-- states -->
  <rect x="110" y="200" width="180" height="72" rx="10" fill="#eaf2fb" stroke="#274a75" stroke-width="2"/>
  <text x="200" y="234" text-anchor="middle" font-size="16" font-weight="bold" fill="#274a75">Stop</text>
  <text x="200" y="256" text-anchor="middle" font-size="12" fill="#445">空闲（默认）</text>

  <rect x="410" y="70" width="180" height="72" rx="10" fill="#eaf2fb" stroke="#274a75" stroke-width="2"/>
  <text x="500" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#274a75">Hot</text>
  <text x="500" y="126" text-anchor="middle" font-size="12" fill="#445">悬停预选（preSelect 生效）</text>

  <rect x="700" y="200" width="180" height="72" rx="10" fill="#eaf2fb" stroke="#274a75" stroke-width="2"/>
  <text x="790" y="234" text-anchor="middle" font-size="16" font-weight="bold" fill="#274a75">OperationGeo</text>
  <text x="790" y="256" text-anchor="middle" font-size="12" fill="#445">拖动选中几何（moveGeo）</text>

  <rect x="410" y="330" width="180" height="72" rx="10" fill="#eaf2fb" stroke="#274a75" stroke-width="2"/>
  <text x="500" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#274a75">DragRect</text>
  <text x="500" y="386" text-anchor="middle" font-size="12" fill="#445">框选（橡皮筋矩形）</text>

  <!-- End: reserved -->
  <rect x="30" y="330" width="130" height="52" rx="8" fill="#f0f0f0" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="95" y="354" text-anchor="middle" font-size="14" fill="#888">End（预留）</text>
  <text x="95" y="372" text-anchor="middle" font-size="11" fill="#999">未使用</text>

  <!-- transitions -->
  <g stroke="#666" stroke-width="2" font-size="12.5" fill="#333">
    <!-- Stop -> Hot -->
    <path d="M 250 210 Q 350 120 408 96" fill="none" marker-end="url(#ar2)"/>
    <text x="330" y="140" text-anchor="middle">移动并拾取到几何</text>
    <!-- Hot -> Stop -->
    <path d="M 420 142 Q 320 210 290 232" fill="none" marker-end="url(#ar2)"/>
    <text x="315" y="200" text-anchor="middle">移出几何</text>
    <!-- Stop -> DragRect -->
    <path d="M 290 260 Q 380 330 408 348" fill="none" marker-end="url(#ar2)"/>
    <text x="355" y="330" text-anchor="middle">空白处左键按下</text>
    <!-- DragRect -> Stop -->
    <path d="M 408 372 Q 300 380 292 276" fill="none" marker-end="url(#ar2)"/>
    <text x="300" y="385" text-anchor="middle">左键释放（框选完成）</text>
    <!-- Hot -> OperationGeo -->
    <path d="M 582 120 Q 690 150 698 195" fill="none" marker-end="url(#ar2)"/>
    <text x="650" y="140" text-anchor="middle">左键按下（选中）</text>
    <!-- OperationGeo -> Hot -->
    <path d="M 700 268 Q 610 290 592 142" fill="none" marker-end="url(#ar2)"/>
    <text x="655" y="290" text-anchor="middle">左键释放</text>
  </g>

  <!-- notes -->
  <text x="460" y="446" text-anchor="middle" font-size="13" fill="#666">注：DELETE 删除选中几何；Ctrl（CONTROL_L）切换 selectMode = AppendSelect / OverrideSelect；</text>
  <text x="460" y="466" text-anchor="middle" font-size="13" fill="#666">存在激活的 DrawSketchHandler 时（isHaveActiveHandler）本对象不参与上述状态转移</text>
</svg>
