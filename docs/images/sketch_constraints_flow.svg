<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520"
     font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="20"  y="20"  width="220" height="90" rx="8" fill="#eef6ff" stroke="#4a8fd4"/>
  <text x="130" y="48" text-anchor="middle" font-weight="bold">Sketch geometry</text>
  <text x="130" y="66" text-anchor="middle" fill="#444">mGeoList</text>
  <text x="130" y="86" text-anchor="middle" fill="#666">(GeoId → Part::Geometry)</text>

  <rect x="20"  y="150" width="220" height="90" rx="8" fill="#eef6ff" stroke="#4a8fd4"/>
  <text x="130" y="178" text-anchor="middle" font-weight="bold">Constraints</text>
  <text x="130" y="196" text-anchor="middle" fill="#444">mConstraintList</text>
  <text x="130" y="216" text-anchor="middle" fill="#666">Constraint(GeoId + PointPos)</text>

  <rect x="320" y="20"  width="220" height="120" rx="8" fill="#fff6e8" stroke="#d99a3d"/>
  <text x="430" y="48" text-anchor="middle" font-weight="bold">setUpSketch()</text>
  <text x="430" y="68" text-anchor="middle" fill="#555">build GCS parameters</text>
  <text x="430" y="86" text-anchor="middle" fill="#555">register constraints</text>
  <text x="430" y="104" text-anchor="middle" fill="#555">count DoF / diagnose</text>

  <rect x="320" y="180" width="220" height="70" rx="8" fill="#fff6e8" stroke="#d99a3d"/>
  <text x="430" y="208" text-anchor="middle" font-weight="bold">solve()</text>
  <text x="430" y="228" text-anchor="middle" fill="#555">GCS: BFGS / DogLeg / LM</text>

  <rect x="620" y="80" width="220" height="110" rx="8" fill="#eaffe8" stroke="#4f9d4f"/>
  <text x="730" y="108" text-anchor="middle" font-weight="bold">extractGeometry()</text>
  <text x="730" y="128" text-anchor="middle" fill="#555">write solved geometry back</text>
  <text x="730" y="146" text-anchor="middle" fill="#555">to mGeoList</text>

  <rect x="620" y="270" width="220" height="80" rx="8" fill="#fdeeee" stroke="#c05050"/>
  <text x="730" y="298" text-anchor="middle" font-weight="bold">diagnostics</text>
  <text x="730" y="318" text-anchor="middle" fill="#555">conflict / redundant / DoF</text>
  <text x="730" y="336" text-anchor="middle" fill="#555">err: -1..-5 / 0</text>

  <line x1="240" y1="65"  x2="315" y2="60"  stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="240" y1="195" x2="315" y2="150" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="430" y1="145" x2="430" y2="175" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="545" y1="215" x2="615" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="195" x2="545" y2="150" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="730" y1="195" x2="730" y2="265" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <rect x="20"  y="300" width="470" height="90" rx="8" fill="#f3f3f3" stroke="#888"/>
  <text x="255" y="328" text-anchor="middle" font-weight="bold">Interaction entry points</text>
  <text x="255" y="350" text-anchor="middle" fill="#555">constraint toolbar commands · auto constraints</text>
  <text x="255" y="370" text-anchor="middle" fill="#555">delete geometry cleanup · drag (initMove / moveGeometries)</text>

  <line x1="255" y1="300" x2="255" y2="245" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="120" y="430" text-anchor="middle" font-size="12" fill="#666">
    Solid arrows: data flow · dashed: diagnostics / edit feedback
  </text>
</svg>
