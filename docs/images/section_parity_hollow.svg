<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <text x="480" y="36" text-anchor="middle" font-size="22" fill="#222">图 4　空心物体：奇偶计数自动跳过空腔</text>

  <!-- plane -->
  <line x1="170" y1="240" x2="790" y2="240" stroke="#3b6fd4" stroke-width="3"/>
  <text x="805" y="244" font-size="15" fill="#3b6fd4">剖切平面</text>

  <!-- hollow box: outer + inner -->
  <rect x="230" y="130" width="440" height="220" fill="rgba(255,150,0,0.16)" stroke="#d9820b" stroke-width="3"/>
  <rect x="280" y="180" width="340" height="120" fill="#ffffff" stroke="#d9820b" stroke-width="3"/>
  <text x="450" y="248" text-anchor="middle" font-size="15" fill="#777">空腔</text>

  <!-- cap segments on the walls -->
  <line x1="232" y1="240" x2="278" y2="240" stroke="#2e9e2e" stroke-width="8"/>
  <line x1="622" y1="240" x2="668" y2="240" stroke="#2e9e2e" stroke-width="8"/>

  <!-- ray 1: through left wall -->
  <line x1="255" y1="60" x2="255" y2="430" stroke="#666" stroke-width="2"/>
  <polygon points="250,430 260,430 255,442" fill="#666"/>
  <circle cx="255" cy="130" r="7" fill="#e0342c"/>
  <text x="272" y="126" font-size="15" fill="#e0342c" font-weight="bold">① 进入壁厚</text>
  <text x="272" y="230" font-size="14" fill="#2e9e2e" font-weight="bold">奇数 → 画（壁厚）</text>

  <!-- ray 2: through hollow center -->
  <line x1="450" y1="60" x2="450" y2="430" stroke="#666" stroke-width="2"/>
  <polygon points="445,430 455,430 450,442" fill="#666"/>
  <circle cx="450" cy="130" r="7" fill="#e0342c"/>
  <text x="466" y="126" font-size="15" fill="#e0342c" font-weight="bold">① 外表面</text>
  <circle cx="450" cy="180" r="7" fill="#e0342c"/>
  <text x="466" y="176" font-size="15" fill="#e0342c" font-weight="bold">② 内表面</text>
  <text x="466" y="248" font-size="14" fill="#a33" font-weight="bold">偶数 → 不画（空腔）✗</text>

  <text x="480" y="480" text-anchor="middle" font-size="14" fill="#666">进入壁厚 +1、离开壁厚再 +1：壁厚处为奇数（画），空腔处为偶数（不画），无需任何几何求交</text>
</svg>
