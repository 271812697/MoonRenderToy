<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Mesh 主框 -->
  <rect x="20" y="20" width="920" height="520" rx="10" fill="#f4f7fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="480" y="48" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b3a55">Rendering::Resources::Mesh（合批 Mesh）</text>

  <!-- 顶点缓冲 -->
  <rect x="60" y="80" width="300" height="200" rx="8" fill="#e8f0fb" stroke="#4a6fa5"/>
  <text x="210" y="105" text-anchor="middle" font-weight="bold" fill="#2b3a55">m_vertexBuffer（一份 GPU 顶点缓冲）</text>
  <line x1="80" y1="125" x2="340" y2="125" stroke="#b9cbe8"/>
  <text x="90" y="145" fill="#33475f">v0 (pos/uv/normal/domainId)</text>
  <text x="90" y="165" fill="#33475f">v1</text>
  <text x="90" y="185" fill="#33475f">v2</text>
  <text x="90" y="205" fill="#33475f">…</text>
  <text x="90" y="230" fill="#66788f">domainId.x = domain 序号</text>
  <text x="90" y="248" fill="#66788f">domainId.y = 叶子 actor ID（拾取）</text>
  <text x="90" y="270" fill="#8a99ad">所有面/边共享这一份顶点</text>

  <!-- 索引子区间 -->
  <rect x="420" y="80" width="250" height="200" rx="8" fill="#eaf6ec" stroke="#4f9d69"/>
  <text x="545" y="105" text-anchor="middle" font-weight="bold" fill="#2b5a3c">m_IndexBuffers[]（N 条子区间）</text>
  <line x1="440" y1="125" x2="650" y2="125" stroke="#bfe0c9"/>
  <text x="450" y="148" fill="#335f44">range 0：不透明面 / 可见边</text>
  <text x="450" y="172" fill="#335f44">range 1：透明高亮面</text>
  <text x="450" y="196" fill="#335f44">…</text>
  <text x="450" y="230" fill="#5d7d69">uploadIndicesCount[i]：每条当前索引数</text>
  <text x="450" y="254" fill="#5d7d69">GetIndexCount(i) == 0 → 渲染端跳过</text>

  <!-- 材质绑定表 -->
  <rect x="740" y="80" width="180" height="200" rx="8" fill="#fdf3e3" stroke="#d19a3e"/>
  <text x="830" y="105" text-anchor="middle" font-weight="bold" fill="#7a5714">材质 ↔ 子区间</text>
  <line x1="755" y1="125" x2="905" y2="125" stroke="#ead6a8"/>
  <text x="760" y="148" fill="#7a5714">material 0 → range 0</text>
  <text x="760" y="172" fill="#7a5714">material 1 → range 1</text>
  <text x="760" y="196" fill="#7a5714">（成对的</text>
  <text x="760" y="214" fill="#7a5714"> m_materialIndex /</text>
  <text x="760" y="232" fill="#7a5714"> m_subRangeIndex）</text>

  <!-- 绑定箭头 -->
  <line x1="340" y1="180" x2="420" y2="180" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="170" text-anchor="middle" fill="#4a6fa5">按偏移引用</text>
  <line x1="670" y1="140" x2="740" y2="140" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="705" y="130" text-anchor="middle" fill="#4a6fa5">绘制绑定</text>

  <!-- 绘制说明 -->
  <rect x="60" y="330" width="880" height="180" rx="8" fill="#f8fafd" stroke="#b9cbe8"/>
  <text x="80" y="360" font-weight="bold" fill="#2b3a55">核心思想：</text>
  <text x="80" y="390" fill="#33475f">1. 所有几何合并进一份顶点缓冲，只上传一次；</text>
  <text x="80" y="416" fill="#33475f">2. 交互控制 = 重建某个子区间的索引并重新上传（可见性 / 透明高亮）；</text>
  <text x="80" y="442" fill="#33475f">3. 渲染端按 (material, subRange) 生成 drawable，空区间直接跳过；</text>
  <text x="80" y="468" fill="#33475f">4. 单 draw call，面数再多也不增加绘制开销。</text>
</svg>
